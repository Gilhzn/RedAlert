name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/red-alert-tiberian-sun-bkdixg]
    paths:
      - docs/preview/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Mirror the playable build to the gh-pages branch. Serving via
  # "Deploy from a branch: gh-pages" sidesteps the Actions deploy
  # environment, whose default branch-protection policy rejects our
  # slash-containing default branch name.
  mirror-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push build snapshot to gh-pages
        run: |
          mkdir -p /tmp/site
          cp docs/preview/index.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Tiberium Dusk browser build"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
